[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clock"
version = "0.1.0"
description = "A high-fidelity terminal countdown timer"
requires-python = ">=3.10"
dependencies = ["textual>=0.50"]

[project.scripts]
clock = "clock.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["clock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
