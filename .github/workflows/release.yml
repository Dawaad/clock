name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target_os }}-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
            target_arch: x86_64
          - runner: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
          - runner: macos-13
            target_os: darwin
            target_arch: x86_64
          - runner: macos-14
            target_os: darwin
            target_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Build standalone binary
        run: |
          pyinstaller --onefile --name clock \
            --collect-all textual \
            --collect-all rich \
            --noconfirm tools/clock_entry.py

      - name: Stage asset
        run: |
          mkdir -p out
          cp dist/clock "out/clock-${{ matrix.target_os }}-${{ matrix.target_arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: clock-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
